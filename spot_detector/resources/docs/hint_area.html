<html>
  <head>
    <title>Area Hint</title>
  </head>
  <h1>Filtering by Area</h1>
  <p>
    SimpleBlobDetector can filter each detected shape by area to decide if it
    should be counted. The filter can have a minimum area and a maximum
    area beyond which the shapes are filtered out. The area is calculated in
    pixels.
  </p>
</html>
